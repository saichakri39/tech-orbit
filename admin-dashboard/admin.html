<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tech Orbit Admin Dashboard</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d1b2a;
        color: white;
      }

      .container {
        max-width: 1200px;
        margin: auto;
        padding: 30px 20px;
      }

      h1 {
        text-align: center;
        color: #ff8c00;
        margin-bottom: 30px;
      }

      /* LOGIN */

      #loginSection {
        max-width: 420px;
        margin: 80px auto;
        background: #1a2332;
        padding: 30px;
        border-radius: 12px;
      }

      #loginSection h2 {
        text-align: center;
        margin-top: 0;
        color: #ff8c00;
      }

      input {
        width: 100%;
        padding: 12px;
        margin: 8px 0 15px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
      }

      button {
        border: none;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }

      .login-btn {
        width: 100%;
        background: #ff8c00;
        color: white;
      }

      .login-btn:hover {
        background: #e36c09;
      }

      #loginError {
        color: #ff6b6b;
        text-align: center;
        margin-top: 15px;
      }

      /* DASHBOARD */

      #dashboardSection {
        display: none;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
        flex-wrap: wrap;
      }

      .admin-email {
        color: #ccc;
      }

      .logout-btn {
        background: #dc3545;
        color: white;
      }

      .logout-btn:hover {
        background: #b52a37;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 25px;
      }

      .stat-box {
        background: #1a2332;
        padding: 25px;
        border-radius: 10px;
        text-align: center;
      }

      .stat-title {
        color: #bbb;
        margin-bottom: 10px;
      }

      .stat-number {
        font-size: 36px;
        font-weight: bold;
        color: #ff8c00;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .refresh-btn {
        background: #ff8c00;
        color: white;
      }

      .csv-btn {
        background: #198754;
        color: white;
      }

      .search-box {
        margin-bottom: 20px;
      }

      .search-box input {
        max-width: 400px;
      }

      .table-container {
        overflow-x: auto;
        background: #1a2332;
        border-radius: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1000px;
      }

      th {
        background: #2e6fbe;
        padding: 13px;
        text-align: left;
      }

      td {
        padding: 12px;
        border-bottom: 1px solid #333;
      }

      tr:hover {
        background: #233247;
      }

      #status {
        margin: 15px 0;
        color: #bbb;
      }

      @media (max-width: 700px) {
        .stats {
          grid-template-columns: 1fr;
        }

        .container {
          padding: 20px 12px;
        }

        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- LOGIN -->
      <section id="loginSection">
        <h2>Tech Orbit Admin</h2>

        <form id="loginForm">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="Admin email" required />

          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />

          <button type="submit" class="login-btn">Login</button>
        </form>

        <div id="loginError"></div>
      </section>

      <!-- DASHBOARD -->
      <section id="dashboardSection">
        <h1>Tech Orbit Admin Dashboard</h1>

        <div class="topbar">
          <div class="admin-email">
            Logged in as:
            <strong id="adminEmail"></strong>
          </div>

          <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <!-- STATISTICS -->
        <div class="stats">
          <div class="stat-box">
            <div class="stat-title">Total Registrations</div>

            <div class="stat-number" id="totalCount">0</div>
          </div>

          <div class="stat-box">
            <div class="stat-title">2nd Year</div>

            <div class="stat-number" id="secondYearCount">0</div>
          </div>

          <div class="stat-box">
            <div class="stat-title">3rd  Year</div>

            <div class="stat-number" id="otherYearCount">0</div>
          </div>
        </div>

        <!-- ACTIONS -->
        <div class="actions">
          <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>

          <button class="csv-btn" id="csvBtn">📥 Download CSV</button>
        </div>

        <!-- SEARCH -->
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Search name, email, roll number..."
          />
        </div>

        <div id="status">Loading registrations...</div>

        <!-- TABLE -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Date</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Roll No</th>
                <th>Year</th>
                <th>Department</th>
<th>Action</th>
              </tr>
            </thead>

            <tbody id="registrationTable"></tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      // ============================================
      // SUPABASE CONFIGURATION
      // ============================================

      const SUPABASE_URL = "https://seltfnpxbmekyskxztmv.supabase.co";

      const SUPABASE_KEY = "sb_publishable_Euu6tTc4yeQBhMvWo1VuNQ_vBKvxhs9";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
      );

      // ============================================
      // ELEMENTS
      // ============================================

      const loginSection = document.getElementById("loginSection");

      const dashboardSection = document.getElementById("dashboardSection");

      const loginForm = document.getElementById("loginForm");

      const loginError = document.getElementById("loginError");

      const adminEmail = document.getElementById("adminEmail");

      const registrationTable = document.getElementById("registrationTable");

      const totalCount = document.getElementById("totalCount");

      const secondYearCount = document.getElementById("secondYearCount");

      const otherYearCount = document.getElementById("otherYearCount");

      const status = document.getElementById("status");

      const searchInput = document.getElementById("searchInput");

      let registrations = [];

      // ============================================
      // LOGIN
      // ============================================

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        loginError.textContent = "";

        const email = document.getElementById("email").value.trim();

        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          loginError.textContent = "Login failed: " + error.message;

          return;
        }

        showDashboard(data.user);
      });

      // ============================================
      // SHOW DASHBOARD
      // ============================================

      function showDashboard(user) {
        loginSection.style.display = "none";

        dashboardSection.style.display = "block";

        adminEmail.textContent = user.email;

        loadRegistrations();
      }

      // ============================================
      // LOAD REGISTRATIONS
      // ============================================

      async function loadRegistrations() {
        status.textContent = "Loading registrations...";

        const { data, error } = await supabaseClient
          .from("registrations")
          .select("*")
          .order("created_at", {
            ascending: false,
          });

        if (error) {
          status.textContent = "Error loading registrations: " + error.message;

          console.error(error);

          return;
        }

        registrations = data || [];

        updateStatistics();

        displayRegistrations(registrations);

        status.textContent = registrations.length + " registration(s) loaded.";
      }

      // ============================================
      // STATISTICS
      // ============================================

      function updateStatistics() {
        totalCount.textContent = registrations.length;

        const secondYear = registrations.filter(function (item) {
          return item.year === "2nd Year";
        }).length;

        secondYearCount.textContent = secondYear;

        otherYearCount.textContent = registrations.length - secondYear;
      }

      // ============================================
      // DISPLAY TABLE
      // ============================================

      function displayRegistrations(data) {
        registrationTable.innerHTML = "";

        if (data.length === 0) {
          registrationTable.innerHTML = `<tr>
                    <td colspan="10" style="text-align:center;">
                        No registrations found.
                    </td>
                </tr>`;

          return;
        }

        data.forEach(function (item) {
          const row = document.createElement("tr");

          const date = item.created_at
            ? new Date(item.created_at).toLocaleString()
            : "";

          row.innerHTML = `
                <td>${escapeHTML(item.id)}</td>

                <td>${escapeHTML(date)}</td>

                <td>${escapeHTML(item.first_name)}</td>

                <td>${escapeHTML(item.last_name)}</td>

                <td>${escapeHTML(item.email)}</td>

                <td>${escapeHTML(item.phone)}</td>

                <td>${escapeHTML(item.roll_no)}</td>

                <td>${escapeHTML(item.year)}</td>

                <td>${escapeHTML(item.department)}</td>

<td>
    <button
        onclick="deleteRegistration(${item.id})"
        style="
            background:#dc3545;
            color:white;
            padding:8px 12px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        "
    >
         Delete
    </button>
</td>
            `;

          registrationTable.appendChild(row);
        });
      }

      // ============================================
      // SEARCH
      // ============================================

      searchInput.addEventListener("input", function () {
        const search = searchInput.value.toLowerCase().trim();

        if (!search) {
          displayRegistrations(registrations);

          return;
        }

        const filtered = registrations.filter(function (item) {
          return (
            String(item.first_name || "")
              .toLowerCase()
              .includes(search) ||
            String(item.last_name || "")
              .toLowerCase()
              .includes(search) ||
            String(item.email || "")
              .toLowerCase()
              .includes(search) ||
            String(item.phone || "")
              .toLowerCase()
              .includes(search) ||
            String(item.roll_no || "")
              .toLowerCase()
              .includes(search) ||
            String(item.year || "")
              .toLowerCase()
              .includes(search)
          );
        });

        displayRegistrations(filtered);
      });

      // ============================================
      // REFRESH
      // ============================================

      document
        .getElementById("refreshBtn")
        .addEventListener("click", loadRegistrations);

      // ============================================
      // AUTO REFRESH EVERY 15 SECONDS
      // ============================================

      setInterval(function () {
        if (dashboardSection.style.display !== "none") {
          loadRegistrations();
        }
      }, 15000);

      // ============================================
      // LOGOUT
      // ============================================

      document
        .getElementById("logoutBtn")
        .addEventListener("click", async function () {
          await supabaseClient.auth.signOut();

          dashboardSection.style.display = "none";

          loginSection.style.display = "block";

          loginForm.reset();
        });

      // ============================================
      // CSV DOWNLOAD
      // ============================================

      document.getElementById("csvBtn").addEventListener("click", function () {
        if (registrations.length === 0) {
          alert("There are no registrations to download.");

          return;
        }

        const headers = [
          "ID",
          "Created At",
          "First Name",
          "Last Name",
          "Email",
          "Phone",
          "Roll No",
          "Year",
          "Department",
        ];

        const rows = registrations.map(function (item) {
          return [
            item.id,
            item.created_at,
            item.first_name,
            item.last_name,
            item.email,
            item.phone,
            item.roll_no,
            item.year,
            item.department,
          ];
        });

        const csv = [headers, ...rows]
          .map(function (row) {
            return row
              .map(function (value) {
                return csvEscape(value);
              })
              .join(",");
          })
          .join("\n");

        const blob = new Blob([csv], {
          type: "text/csv;charset=utf-8;",
        });

        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");

        link.href = url;

        link.download = "tech-orbit-registrations.csv";

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

        URL.revokeObjectURL(url);
      });

      // ============================================
      // CSV ESCAPE
      // ============================================

      function csvEscape(value) {
        if (value === null || value === undefined) {
          return '""';
        }

        return '"' + String(value).replace(/"/g, '""') + '"';
      }

      // ============================================
      // HTML ESCAPE
      // ============================================

      function escapeHTML(value) {
        if (value === null || value === undefined) {
          return "";
        }

        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // ============================================
      // CHECK EXISTING LOGIN SESSION
      // ============================================

      async function checkSession() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();

        if (session && session.user) {
          showDashboard(session.user);
        }
      }

      checkSession();
      // ============================================
// DELETE REGISTRATION
// ============================================

async function deleteRegistration(id) {

    const registration =
        registrations.find(function(item) {
            return item.id === id;
        });

    if (!registration) {
        return;
    }

    const confirmed = confirm(
        "Are you sure you want to delete the registration of " +
        registration.first_name +
        " " +
        registration.last_name +
        "?"
    );

    if (!confirmed) {
        return;
    }

    status.textContent =
        "Deleting registration...";

    const { error } =
        await supabaseClient
            .from("registrations")
            .delete()
            .eq("id", id);

    if (error) {

        console.error(error);

        status.textContent =
            "Delete failed: " +
            error.message;

        alert(
            "Could not delete registration.\n\n" +
            error.message
        );

        return;
    }

    alert("Registration deleted successfully.");

    await loadRegistrations();
}
    </script>
  </body>
</html>
