<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Orbit Registration - Test</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: block;
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin: 0 auto 15px;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #1F3864;
            font-size: 30px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin: 10px auto 30px;
            line-height: 1.5;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #1F3864;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #2E6FBE;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            background: white;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #1F3864;
            box-shadow: 0 0 0 3px rgba(46, 111, 190, 0.12);
        }

        input::placeholder {
            color: #888;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #FF8C00;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #E36C09;
        }

        .footer-text {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!--
            Put your Tech Orbit logo in the same folder
            and change the filename if necessary.
        -->
        <img src="logo.jpeg" alt="Tech Orbit Logo" class="logo">

        <h1>TECH ORBIT</h1>

        <p class="subtitle">
            Register to join Tech Orbit and participate in
            coding, web development, projects and technical activities.
        </p>

        <form id="form">

            <div class="form-group">
                <label for="fname">First Name</label>
                <input
                    type="text"
                    id="fname"
                    placeholder="Enter your first name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="lname">Last Name</label>
                <input
                    type="text"
                    id="lname"
                    placeholder="Enter your last name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required 
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input
                    type="text"
                    id="roll"
                    placeholder="Enter your roll number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="year">Year</label>

                <select id="year" required>
                    <option value="">Select your year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="Final Year">Final Year</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dept">Department</label>

                <select id="dept" required>
                    <option value="">Select your department</option>
                    <option value="AI&DS">Artificial intelligence & Data Science</option>
                    </select>
            </div>

            <button type="submit">
                JOIN TECH ORBIT
            </button>

        </form>

        <p class="footer-text">
            Tech Orbit • AI & Data Science
        </p>

    </div>


    <script>

        document.getElementById("form").addEventListener("submit", function(e) {

            e.preventDefault();

            const data = {
                timestamp: new Date().toLocaleString(),

                firstName:
                    document.getElementById("fname").value.trim(),

                lastName:
                    document.getElementById("lname").value.trim(),

                email:
                    document.getElementById("email").value.trim(),

                phone:
                    document.getElementById("phone").value.trim(),

                rollNo:
                    document.getElementById("roll").value.trim(),

                year:
                    document.getElementById("year").value,

                department:
                    document.getElementById("dept").value
            };


            // Save registration locally
            let registrations =
                JSON.parse(localStorage.getItem("registrations")) || [];

            registrations.push(data);

            localStorage.setItem(
                "registrations",
                JSON.stringify(registrations)
            );


            alert(
                "Registration Successful!\n\n" +
                "Thank you for joining Tech Orbit!"
            );


            this.reset();

        });

    </script>

</body>
</html>
