<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tech Orbit Registration</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 30px 15px;
        font-family: Arial, sans-serif;
        background: #f3f5f8;
      }

      .container {
        max-width: 650px;
        margin: auto;
        background: #ffffff;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      .logo {
        display: block;
        width: 70px;
        height: 70px;
        object-fit: contain;
        margin: 0 auto 15px;
      }

      h1 {
        margin: 0;
        text-align: center;
        color: #1f3864;
        font-size: 30px;
        letter-spacing: 1px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin: 10px auto 30px;
        line-height: 1.5;
        max-width: 500px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: #1f3864;
        font-weight: 600;
        font-size: 14px;
      }

      input,
      select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #2e6fbe;
        border-radius: 7px;
        font-size: 15px;
        outline: none;
        background: white;
        transition: 0.2s;
      }

      input:focus,
      select:focus {
        border-color: #1f3864;
        box-shadow: 0 0 0 3px rgba(46, 111, 190, 0.12);
      }

      input::placeholder {
        color: #888;
      }

      button {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        background: #ff8c00;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #e36c09;
      }

      button:disabled {
        background: #999;
        cursor: not-allowed;
      }

      .footer-text {
        text-align: center;
        color: #777;
        font-size: 13px;
        margin-top: 20px;
      }

      .status {
        display: none;
        margin-top: 15px;
        padding: 12px;
        border-radius: 7px;
        text-align: center;
        font-size: 14px;
      }

      .success {
        display: block;
        background: #e8f7ee;
        color: #18743a;
      }

      .error {
        display: block;
        background: #fdeaea;
        color: #b42318;
      }

      @media (max-width: 600px) {
        body {
          padding: 15px;
        }

        .container {
          padding: 25px 20px;
        }

        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Tech Orbit Logo -->
      <img src="logo.jpeg" alt="Tech Orbit Logo" class="logo" />

      <h1>TECH ORBIT</h1>

      <p class="subtitle">
        Register to join Tech Orbit and participate in coding, web development,
        projects and technical activities.
      </p>

      <form id="form">
        <!-- First Name -->
        <div class="form-group">
          <label for="fname"> First Name </label>

          <input
            type="text"
            id="fname"
            placeholder="Enter your first name"
            required
          />
        </div>

        <!-- Last Name -->
        <div class="form-group">
          <label for="lname"> Last Name </label>

          <input
            type="text"
            id="lname"
            placeholder="Enter your last name"
            required
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email"> Email Address </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="phone"> Phone Number </label>

          <input
            type="tel"
            id="phone"
            placeholder="Enter 10-digit phone number"
            pattern="[0-9]{10}"
            maxlength="10"
            inputmode="numeric"
            required
          />
        </div>

        <!-- Roll Number -->
        <div class="form-group">
          <label for="roll"> Roll Number </label>

          <input
            type="text"
            id="roll"
            placeholder="Enter your roll number"
            required
          />
        </div>

        <!-- Year -->
        <div class="form-group">
          <label for="year"> Year </label>

          <select id="year" required>
            <option value="">Select your year</option>

            <option value="2nd Year">2nd Year</option>

            <option value="3rd Year">3rd Year</option>

            <option value="Final Year">Final Year</option>
          </select>
        </div>

        <!-- Department -->
        <div class="form-group">
          <label for="dept"> Department </label>

          <select id="dept" required>
            <option value="">Select your department</option>

            <option value="CSE (Artificial Intelligence and Data Science)">
              CSE (Artificial Intelligence and Data Science)
            </option>
          </select>
        </div>

        <!-- Submit -->
        <button type="submit" id="submitBtn">JOIN TECH ORBIT</button>

        <!-- Status message -->
        <div id="status" class="status"></div>
      </form>

      <p class="footer-text">
        Tech Orbit • CSE (Artificial Intelligence and Data Science)
      </p>
    </div>

    <script>
      // =====================================================
      // SUPABASE CONFIGURATION
      // =====================================================

const SUPABASE_URL =
    "https://seltfnpxbmekyskxztmv.supabase.co";

      const SUPABASE_KEY = "sb_publishable_Euu6tTc4yeQBhMvWo1VuNQ_vBKvxhs9";

      // =====================================================
      // FORM
      // =====================================================

      const form = document.getElementById("form");

      const submitButton = document.getElementById("submitBtn");

      const status = document.getElementById("status");

      // =====================================================
      // SHOW STATUS
      // =====================================================

      function showStatus(message, type) {
        status.textContent = message;

        status.className = "status " + type;
      }

      // =====================================================
      // SUBMIT REGISTRATION
      // =====================================================

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        // Disable button
        submitButton.disabled = true;

        submitButton.textContent = "SUBMITTING...";

        status.className = "status";

        status.textContent = "";

        // =================================================
        // GET FORM DATA
        // =================================================

        const registration = {
          first_name: document.getElementById("fname").value.trim(),

          last_name: document.getElementById("lname").value.trim(),

          email: document.getElementById("email").value.trim(),

          phone: document.getElementById("phone").value.trim(),

          roll_no: document.getElementById("roll").value.trim(),

          year: document.getElementById("year").value,

          department: document.getElementById("dept").value,
        };

        try {
          // =================================================
          // SEND DATA TO SUPABASE
          // =================================================

          const response = await fetch(
            SUPABASE_URL + "/rest/v1/registrations",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json",

                apikey: SUPABASE_KEY,

                Authorization: "Bearer " + SUPABASE_KEY,

                Prefer: "return=minimal",
              },

              body: JSON.stringify(registration),
            },
          );

          // =================================================
          // CHECK RESPONSE
          // =================================================

          if (!response.ok) {
            let errorMessage = "Registration failed.";

            try {
              const errorData = await response.json();

              console.error("Supabase error:", errorData);

              errorMessage =
                errorData.message || errorData.error || errorMessage;
            } catch (jsonError) {
              console.error("Could not read error:", jsonError);
            }

            throw new Error(errorMessage);
          }

          // =================================================
          // SUCCESS
          // =================================================

          console.log("Registration successful:", registration);

          showStatus(
            "Registration successful! 🎉 Thank you for joining Tech Orbit.",
            "success",
          );

          alert(
            "Registration Successful! 🎉\n\n" +
              "Thank you for joining Tech Orbit!",
          );

          // Clear form
          form.reset();
        } catch (error) {
          // =====================================================
          // ERROR
          // =====================================================

          console.error("Registration failed:", error);

          showStatus("Registration failed: " + error.message, "error");

          alert("Registration failed.\n\n" + error.message);
        }

        // Enable button
        submitButton.disabled = false;

        submitButton.textContent = "JOIN TECH ORBIT";
      });
    </script>
  </body>
</html>
